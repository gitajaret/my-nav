<html lang="zh-CN">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>聚合导航</title>
<meta name="description" content="个人网址导航与文章笔记">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d0f14;--bg2:#12151c;--card:#181c25;--card2:#1f2430;
  --text:#e8eaf0;--dim:#8a92a6;--line:#252b38;--accent:#5b8def;--accent2:#7c5bff;
  --ok:#3fb950;--warn:#d29922;--radius:14px;
  --shadow:0 4px 24px rgba(0,0,0,.35);
}
[data-theme=light]{
  --bg:#f7f8fa;--bg2:#fff;--card:#fff;--card2:#f0f2f6;
  --text:#16181d;--dim:#6b7280;--line:#e4e7ec;--accent:#2563eb;--accent2:#7c3aed;
  --shadow:0 4px 20px rgba(0,0,0,.07);
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;
  transition:background .2s,color .2s;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ---------- 布局 ---------- */
.layout{display:flex;min-height:100vh}
.sidebar{
  width:210px;flex-shrink:0;border-right:1px solid var(--line);
  background:var(--bg2);padding:18px 12px;position:sticky;top:0;height:100vh;
  overflow-y:auto;display:flex;flex-direction:column;gap:4px;
}
.main{flex:1;min-width:0;display:flex;flex-direction:column}

/* ---------- 侧栏 ---------- */
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 18px;font-weight:600;font-size:15px}
.brand-dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 10px var(--accent)}
.nav-label{font-size:11px;color:var(--dim);padding:14px 10px 6px;letter-spacing:.06em;text-transform:uppercase}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;
  font-size:13.5px;color:var(--dim);transition:all .15s;width:100%;text-align:left;
}
.nav-item:hover{background:var(--card2);color:var(--text)}
.nav-item.active{background:var(--card);color:var(--text);font-weight:500;box-shadow:inset 0 0 0 1px var(--line)}
.nav-ico{width:17px;text-align:center;font-size:14px;flex-shrink:0}
.nav-count{margin-left:auto;font-size:11px;color:var(--dim);background:var(--bg);padding:1px 6px;border-radius:20px}
.sidebar-foot{margin-top:auto;padding:14px 8px 4px;border-top:1px solid var(--line);display:flex;gap:8px}

/* ---------- 顶栏 ---------- */
.topbar{
  display:flex;align-items:center;gap:12px;padding:14px 22px;
  border-bottom:1px solid var(--line);background:var(--bg2);
  position:sticky;top:0;z-index:20;
}
.crumb{font-size:13px;color:var(--dim);display:flex;align-items:center;gap:6px;min-width:0}
.crumb b{color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.icon-btn{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);display:flex;align-items:center;justify-content:center;
  font-size:15px;color:var(--dim);transition:all .15s;flex-shrink:0;
}
.icon-btn:hover{color:var(--text);border-color:var(--accent);background:var(--card2)}

/* ---------- 搜索 ---------- */
.searchbar{padding:18px 22px 0;position:relative}
.searchbar input{
  width:100%;padding:12px 44px 12px 42px;border-radius:11px;
  border:1px solid var(--line);background:var(--card);color:var(--text);
  font-size:14px;outline:none;transition:all .18s;
}
.searchbar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,141,239,.12)}
.searchbar input::placeholder{color:var(--dim)}
.s-ico{position:absolute;left:36px;top:50%;transform:translateY(-33%);color:var(--dim);font-size:14px;pointer-events:none}
.s-kbd{position:absolute;right:36px;top:50%;transform:translateY(-33%);font-size:11px;color:var(--dim);border:1px solid var(--line);padding:2px 6px;border-radius:5px;background:var(--bg);pointer-events:none}

/* ---------- 内容区 ---------- */
.content{padding:20px 22px 60px;flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px;display:flex;gap:12px;align-items:flex-start;
  transition:all .18s;cursor:pointer;position:relative;
}
.card:hover{background:var(--card2);border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.card-ico{
  width:38px;height:38px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;
  background:linear-gradient(135deg,rgba(91,141,239,.18),rgba(124,91,255,.18));
  color:var(--accent);overflow:hidden;
}
.card-ico img{width:100%;height:100%;object-fit:cover}
.card-body{min-width:0;flex:1}
.card-title{font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px}
.card-title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-desc{
  font-size:12px;color:var(--dim);margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.tag{
  display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:20px;
  border:1px solid var(--line);color:var(--dim);margin-top:7px;
}
.badge-art{
  font-size:10px;padding:1px 6px;border-radius:20px;flex-shrink:0;
  background:rgba(124,91,255,.15);color:#a78bfa;border:1px solid rgba(124,91,255,.3);
}

/* ---------- 详情页 ---------- */
.detail{max-width:760px;margin:0 auto}
.detail-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:22px}
.detail-ico{
  width:56px;height:56px;border-radius:14px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;
  background:linear-gradient(135deg,rgba(91,141,239,.18),rgba(124,91,255,.18));color:var(--accent);
}
.detail h1{font-size:22px;font-weight:600;margin-bottom:5px;line-height:1.3}
.detail-sub{font-size:13px;color:var(--dim)}
.detail-meta{
  display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;
  padding-bottom:18px;border-bottom:1px solid var(--line);
}
.chip{
  font-size:12px;padding:4px 10px;border-radius:8px;
  background:var(--card);border:1px solid var(--line);color:var(--dim);
}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;
  font-size:13.5px;font-weight:500;transition:all .16s;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  box-shadow:0 3px 12px rgba(91,141,239,.25);
}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-ghost{
  background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:none;
}
.btn-ghost:hover{border-color:var(--accent);background:var(--card2)}
.detail-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}

/* ---------- 文章正文 ---------- */
.article{font-size:15px;line-height:1.85;color:var(--text)}
.article h2{font-size:18px;font-weight:600;margin:30px 0 12px;padding-left:11px;border-left:3px solid var(--accent)}
.article h3{font-size:15.5px;font-weight:600;margin:22px 0 9px;color:var(--text)}
.article p{margin:12px 0;color:var(--text)}
.article ul,.article ol{margin:12px 0 12px 22px;color:var(--text)}
.article li{margin:6px 0}
.article code{
  background:var(--card2);padding:2px 6px;border-radius:5px;
  font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#a78bfa;
}
.article pre{
  background:var(--bg2);border:1px solid var(--line);border-radius:10px;
  padding:14px;overflow-x:auto;margin:14px 0;
}
.article pre code{background:none;padding:0;color:var(--text);font-size:12.5px;line-height:1.65}
.article blockquote{
  border-left:3px solid var(--accent);background:var(--card);
  padding:10px 16px;margin:14px 0;border-radius:0 8px 8px 0;color:var(--dim);font-size:14px;
}
.article a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.article table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px}
.article th,.article td{border:1px solid var(--line);padding:8px 12px;text-align:left}
.article th{background:var(--card2);font-weight:600}
.article hr{border:none;border-top:1px solid var(--line);margin:24px 0}
.article strong{font-weight:600;color:var(--text)}

/* ---------- 空态 ---------- */
.empty{text-align:center;padding:80px 20px;color:var(--dim)}
.empty-ico{font-size:38px;margin-bottom:12px;opacity:.5}
.empty-t{font-size:15px;margin-bottom:5px}
.empty-s{font-size:13px;opacity:.75}

/* ---------- 分组标题 ---------- */
.group{margin-bottom:30px}
.group-head{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.group-title{font-size:14px;font-weight:600}
.group-desc{font-size:12px;color:var(--dim)}
.group-n{font-size:11px;color:var(--dim);background:var(--card);border:1px solid var(--line);padding:1px 7px;border-radius:20px}

/* ---------- 移动端 ---------- */
.menu-btn{display:none}
@media(max-width:860px){
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;z-index:60;
    transform:translateX(-100%);transition:transform .22s;box-shadow:var(--shadow);
  }
  .sidebar.open{transform:translateX(0)}
  .menu-btn{display:flex}
  .content{padding:16px 15px 50px}
  .searchbar{padding:14px 15px 0}
  .s-ico{left:29px}.s-kbd{right:29px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .card{padding:12px;gap:10px}
  .card-ico{width:34px;height:34px;font-size:15px}
  .topbar{padding:12px 15px}
  .detail h1{font-size:19px}
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;display:none}
  .mask.on{display:block}
}
</style>
</head>

/* =====================================================================
   以下为逻辑，一般不用改动
   ===================================================================== */

const state = { theme: localStorage.getItem("nav-theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"), q: "" };

const $ = (s) => document.querySelector(s);
const app = $("#app"), navList = $("#navList"), crumb = $("#crumb"), searchWrap = $("#searchWrap");

/* ---------- 工具 ---------- */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function iconHtml(item, cls) {
  const ic = item.icon || "";
  if (/^https?:\/\//.test(ic)) return '<div class="' + cls + '"><img src="' + esc(ic) + '" alt="" loading="lazy"></div>';
  const txt = ic || (item.title || "?").charAt(0).toUpperCase();
  return '<div class="' + cls + '">' + esc(txt) + "</div>";
}

/* 迷你 Markdown 渲染（标题/列表/代码/引用/表格/粗体/链接） */
function md(src) {
  const lines = String(src || "").replace(/\r/g, "").split("\n");
  let out = [], i = 0, inCode = false, codeBuf = [], listType = null, tableBuf = [];

  const flushList = () => { if (listType) { out.push("</" + listType + ">"); listType = null; } };
  const flushTable = () => {
    if (!tableBuf.length) return;
    const rows = tableBuf.filter(r => !/^\s*\|?[\s:-]+\|/.test(r));
    let h = "<table>";
    rows.forEach((r, idx) => {
      const cells = r.split("|").slice(1, -1).map(c => c.trim());
      h += "<tr>" + cells.map(c => (idx === 0 ? "<th>" : "<td>") + inline(c) + (idx === 0 ? "</th>" : "</td>")).join("") + "</tr>";
    });
    out.push(h + "</table>");
    tableBuf = [];
  };
  const inline = (t) => esc(t)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\`([^\`]+)\`/g, "<code>$1</code>")
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  for (; i < lines.length; i++) {
    const ln = lines[i];
    if (/^\s*\`\`\`/.test(ln)) {
      if (!inCode) { inCode = true; codeBuf = []; flushList(); flushTable(); }
      else { out.push("<pre><code>" + esc(codeBuf.join("\n")) + "</code></pre>"); inCode = false; }
      continue;
    }
    if (inCode) { codeBuf.push(ln); continue; }

    if (/^\s*\|.*\|\s*$/.test(ln)) { flushList(); tableBuf.push(ln); continue; }
    else if (tableBuf.length) flushTable();

    let m;
    if ((m = ln.match(/^###\s+(.*)/))) { flushList(); out.push("<h3>" + inline(m[1]) + "</h3>"); continue; }
    if ((m = ln.match(/^##\s+(.*)/))) { flushList(); out.push("<h2>" + inline(m[1]) + "</h2>"); continue; }
    if ((m = ln.match(/^#\s+(.*)/))) { flushList(); out.push("<h2>" + inline(m[1]) + "</h2>"); continue; }
    if ((m = ln.match(/^>\s?(.*)/))) { flushList(); out.push("<blockquote>" + inline(m[1]) + "</blockquote>"); continue; }
    if (/^---+s*$/.test(ln)) { flushList(); out.push("<hr>"); continue; }
    if ((m = ln.match(/^\s*[-*]\s+(.*)/))) {
      if (listType !== "ul") { flushList(); out.push("<ul>"); listType = "ul"; }
      out.push("<li>" + inline(m[1]) + "</li>"); continue;
    }
    if ((m = ln.match(/^\s*\d+\.\s+(.*)/))) {
      if (listType !== "ol") { flushList(); out.push("<ol>"); listType = "ol"; }
      out.push("<li>" + inline(m[1]) + "</li>"); continue;
    }
    flushList();
    if (ln.trim() === "") continue;
    out.push("<p>" + inline(ln) + "</p>");
  }
  flushList(); flushTable();
  if (inCode && codeBuf.length) out.push("<pre><code>" + esc(codeBuf.join("\n")) + "</code></pre>");
  return out.join("");
}

/* ---------- 主题 ---------- */
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  state.theme = t;
  localStorage.setItem("nav-theme", t);
  const b = $("#themeBtn");
  if (b) b.textContent = t === "light" ? "☀️" : "🌙";
}

/* ---------- 数据整理 ---------- */
const GROUPS = [...new Set(ITEMS.map(i => i.group))];
const GROUP_META = {
  "网站链接": { icon: "🔗" },
  "使用教程": { icon: "📘" },
  "问题解答": { icon: "💡" }
};

function countsByGroup() {
  const m = {};
  GROUPS.forEach(g => m[g] = ITEMS.filter(i => i.group === g).length);
  return m;
}

/* ---------- 侧栏 ---------- */
function renderSidebar(active) {
  const c = countsByGroup();
  let h = '<div class="nav-label">全部</div>';
  h += '<button class="nav-item' + (active === "all" ? " active" : "") + '" data-go="all">' +
       '<span class="nav-ico">📌</span><span>全部内容</span><span class="nav-count">' + ITEMS.length + "</span></button>";
  h += '<div class="nav-label">分组</div>';
  GROUPS.forEach(g => {
    const ico = (GROUP_META[g] && GROUP_META[g].icon) || "📁";
    h += '<button class="nav-item' + (active === g ? " active" : "") + '" data-go="' + esc(g) + '">' +
         '<span class="nav-ico">' + ico + '</span><span>' + esc(g) + '</span><span class="nav-count">' + c[g] + "</span></button>";
  });
  navList.innerHTML = h;
}

/* ---------- 卡片 ---------- */
function cardHtml(it, idx) {
  const isArt = it.type === "article";
  return '<div class="card" data-idx="' + idx + '">' +
    iconHtml(it, "card-ico") +
    '<div class="card-body">' +
      '<div class="card-title">' +
        '<span>' + esc(it.title) + '</span>' +
        (isArt ? '<span class="badge-art">文章</span>' : "") +
      "</div>" +
      (it.desc ? '<div class="card-desc">' + esc(it.desc) + "</div>" : "") +
      (it.tags ? '<div class="tag">' + esc(it.tags.join(" · ")) + "</div>" : "") +
    "</div>" +
  "</div>";
}

/* ---------- 首页 ---------- */
function renderHome(group) {
  searchWrap.innerHTML = '<div class="searchbar"><span class="s-ico">🔍</span>' +
    '<input id="q" type="text" placeholder="搜索标题、简介或标签…" autocomplete="off" value="' + esc(state.q) + '">' +
    '<span class="s-kbd">/</span></div>';

  let list = ITEMS;
  if (group && group !== "all") list = list.filter(i => i.group === group);
  if (state.q.trim()) {
    const k = state.q.trim().toLowerCase();
    list = list.filter(i => (i.title + " " + (i.desc || "") + " " + (i.tags || []).join(" ") + " " + (i.url || "")).toLowerCase().includes(k));
  }

  if (!list.length) {
    app.innerHTML = '<div class="empty"><div class="empty-ico">🔍</div><div class="empty-t">没有找到匹配的内容</div><div class="empty-s">试试换个关键词</div></div>';
    return;
  }

  let h = "";
  if (group && group !== "all") {
    const meta = GROUP_META[group] || {};
    h += '<div class="group"><div class="group-head"><span class="group-title">' + esc(group) + "</span>" +
         '<span class="group-n">' + list.length + "</span></div>" +
         '<div class="grid">' + list.map(cardHtml).join("") + "</div></div>";
  } else {
    GROUPS.forEach(g => {
      const sub = list.filter(i => i.group === g);
      if (!sub.length) return;
      const meta = GROUP_META[g] || {};
      h += '<div class="group"><div class="group-head">' +
           '<span class="group-title">' + (meta.icon || "📁") + " " + esc(g) + "</span>" +
           '<span class="group-n">' + sub.length + "</span></div>" +
           '<div class="grid">' + sub.map(cardHtml).join("") + "</div></div>";
    });
  }
  app.innerHTML = h;

  const q = $("#q");
  if (q) {
    q.addEventListener("input", (e) => { state.q = e.target.value; renderHome(group); const n = $("#q"); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } });
  }
}

/* ---------- 详情页 ---------- */
function renderDetail(idx) {
  const it = ITEMS[idx];
  if (!it) { location.hash = ""; return; }
  searchWrap.innerHTML = "";
  const isArt = it.type === "article";

  let h = '<div class="detail">';
  h += '<div class="detail-head">' + iconHtml(it, "detail-ico") +
       "<div><h1>" + esc(it.title) + "</h1>" +
       '<div class="detail-sub">' + esc(it.desc || "") + "</div></div></div>";

  h += '<div class="detail-meta">';
  h += '<span class="chip">📁 ' + esc(it.group) + "</span>";
  if (it.tags) it.tags.forEach(t => h += '<span class="chip">' + esc(t) + "</span>");
  if (isArt && it.date) h += '<span class="chip">🗓 ' + esc(it.date) + "</span>";
  if (isArt && it.read) h += '<span class="chip">⏱ 约 ' + it.read + " 分钟</span>";
  h += "</div>";

  if (!isArt) {
    h += '<div class="detail-actions">' +
         '<a class="btn" href="' + esc(it.url) + '" target="_blank" rel="noopener">🚀 打开网站</a>' +
         '<button class="btn btn-ghost" data-copy="' + esc(it.url) + '">📋 复制链接</button>' +
         '<button class="btn btn-ghost" data-back>← 返回</button></div>';
    h += '<div class="article"><h2>关于这个网站</h2><p>' + esc(it.desc || "") + "</p>";
    h += "<p>访问地址：<code>" + esc(it.url) + "</code></p>";
    if (it.tags) h += "<p>标签：" + esc(it.tags.join(" / ")) + "</p>";
    h += "</div>";
  } else {
    h += '<div class="detail-actions"><button class="btn btn-ghost" data-back>← 返回</button></div>';
    h += '<div class="article">' + md(it.body || "") + "</div>";
  }
  h += "</div>";
  app.innerHTML = h;

  crumb.innerHTML = '<span>首页</span> / <b>' + esc(it.title) + "</b>";
  window.scrollTo(0, 0);
}

/* ---------- 路由 ---------- */
function route() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("/item/")) {
    renderDetail(parseInt(h.slice(6), 10));
    return;
  }
  const group = h.startsWith("/g/") ? decodeURIComponent(h.slice(3)) : "all";
  renderSidebar(group);
  crumb.innerHTML = group === "all" ? "<b>全部内容</b>" : "<b>" + esc(group) + "</b>";
  renderHome(group);
}

/* ---------- 事件 ---------- */
document.addEventListener("click", (e) => {
  const go = e.target.closest("[data-go]");
  if (go) {
    const g = go.dataset.go;
    location.hash = g === "all" ? "" : "/g/" + encodeURIComponent(g);
    $("#sidebar").classList.remove("open");
    $("#mask").classList.remove("on");
    return;
  }
  const card = e.target.closest(".card");
  if (card) { location.hash = "/item/" + card.dataset.idx; return; }

  if (e.target.closest("[data-back]")) { history.back(); return; }

  const copy = e.target.closest("[data-copy]");
  if (copy) {
    navigator.clipboard.writeText(copy.dataset.copy).then(() => {
      const old = copy.textContent;
      copy.textContent = "✅ 已复制";
      setTimeout(() => copy.textContent = old, 1500);
    });
  }
});

$("#themeBtn").addEventListener("click", () => applyTheme(state.theme === "light" ? "dark" : "light"));
$("#homeBtn").addEventListener("click", () => { location.hash = ""; });
$("#menuBtn").addEventListener("click", () => {
  $("#sidebar").classList.toggle("open");
  $("#mask").classList.toggle("on");
});
$("#mask").addEventListener("click", () => {
  $("#sidebar").classList.remove("open");
  $("#mask").classList.remove("on");
});

document.addEventListener("keydown", (e) => {
  if (e.key === "/" && !/input|textarea/i.test(document.activeElement.tagName)) {
    e.preventDefault();
    const q = $("#q"); if (q) q.focus();
  }
  if (e.key === "Escape") { state.q = ""; route(); }
});

window.addEventListener("hashchange", route);

/* ---------- 启动 ---------- */
applyTheme(state.theme);
route();
</script>
</body>
</html>
