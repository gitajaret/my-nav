<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的导航</title>
<meta name="description" content="个人导航站">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f1115;--card:#171a21;--card-hover:#1e222b;--text:#e6e8ec;
  --text-dim:#8b93a3;--accent:#4c8dff;--border:#262b36;
}
[data-theme="light"]{
  --bg:#f5f6f8;--card:#ffffff;--card-hover:#f0f2f5;--text:#1a1d23;
  --text-dim:#6b7280;--accent:#2563eb;--border:#e5e7eb;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  transition:background .25s,color .25s;padding:0 20px 60px;
}
.wrap{max-width:1100px;margin:0 auto}

/* 顶栏 */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:26px 0 18px;gap:16px;flex-wrap:wrap;
}
.logo{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:600}
.logo-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.actions{display:flex;gap:10px;align-items:center}
.icon-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--border);
  background:var(--card);color:var(--text-dim);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:17px;
  transition:all .2s;
}
.icon-btn:hover{background:var(--card-hover);color:var(--text);border-color:var(--accent)}

/* 搜索 */
.search-box{position:relative;margin:8px 0 28px}
#search{
  width:100%;padding:15px 52px 15px 48px;border-radius:14px;
  border:1px solid var(--border);background:var(--card);color:var(--text);
  font-size:15px;outline:none;transition:all .2s;
}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(76,141,255,.13)}
#search::placeholder{color:var(--text-dim)}
.search-icon{
  position:absolute;left:17px;top:50%;transform:translateY(-50%);
  color:var(--text-dim);font-size:16px;pointer-events:none;
}
.kbd{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  font-size:11px;color:var(--text-dim);border:1px solid var(--border);
  padding:3px 7px;border-radius:6px;background:var(--bg);pointer-events:none;
}

/* 分组 */
.section{margin-bottom:34px}
.section-head{
  display:flex;align-items:center;gap:10px;margin-bottom:14px;
  cursor:pointer;user-select:none;padding:2px 0;
}
.section-title{font-size:14px;font-weight:600;color:var(--text)}
.section-count{
  font-size:11px;color:var(--text-dim);background:var(--card);
  border:1px solid var(--border);padding:2px 8px;border-radius:20px;
}
.section-arrow{margin-left:auto;color:var(--text-dim);font-size:12px;transition:transform .2s}
.section.collapsed .section-arrow{transform:rotate(-90deg)}
.section.collapsed .grid{display:none}

/* 卡片网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.card{
  display:flex;align-items:center;gap:12px;padding:14px 15px;
  background:var(--card);border:1px solid var(--border);border-radius:13px;
  text-decoration:none;color:inherit;transition:all .18s;position:relative;overflow:hidden;
}
.card:hover{
  background:var(--card-hover);border-color:var(--accent);
  transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.18);
}
.card-icon{
  width:36px;height:36px;border-radius:9px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:600;background:rgba(76,141,255,.13);color:var(--accent);
}
.card-body{min-width:0;flex:1}
.card-name{
  font-size:14px;font-weight:500;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.card-desc{
  font-size:11.5px;color:var(--text-dim);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* 空状态 */
.empty{text-align:center;padding:70px 20px;color:var(--text-dim);font-size:14px;display:none}
.empty.show{display:block}

footer{text-align:center;color:var(--text-dim);font-size:12px;padding-top:20px}

@media(max-width:640px){
  body{padding:0 14px 40px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .card{padding:12px}
  .card-icon{width:32px;height:32px;font-size:15px}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo"><span class="logo-dot"></span><span id="siteTitle">我的导航</span></div>
    <div class="actions">
      <button class="icon-btn" id="themeBtn" title="切换主题">🌙</button>
    </div>
  </header>

  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="搜索站点名称或描述..." autocomplete="off">
    <span class="kbd">/</span>
  </div>

  <main id="app"></main>
  <div class="empty" id="empty">没有找到匹配的站点</div>

  <footer>Static Nav · Powered by Cloudflare</footer>
</div>

<script>
/* =========================================================
   配置区：只改这里就能维护整个站点
   格式：{ name: 显示名, url: 链接, desc: 描述, icon: 可选emoji或文字 }
   ========================================================= */
const SITE_TITLE = "我的导航";

const DATA = [
  {
    group: "常用",
    items: [
      { name: "GitHub",  url: "https://github.com",      desc: "代码托管",     icon: "G" },
      { name: "Google",  url: "https://google.com",      desc: "搜索引擎",     icon: "🔍" },
      { name: "YouTube", url: "https://youtube.com",     desc: "视频平台",     icon: "▶" },
      { name: "ChatGPT", url: "https://chat.openai.com", desc: "AI 对话",      icon: "🤖" }
    ]
  },
  {
    group: "开发工具",
    items: [
      { name: "MDN",        url: "https://developer.mozilla.org", desc: "Web 文档",    icon: "📖" },
      { name: "Stack Overflow", url: "https://stackoverflow.com", desc: "技术问答",    icon: "S" },
      { name: "Can I Use",  url: "https://caniuse.com",          desc: "兼容性查询",  icon: "C" },
      { name: "Vercel",     url: "https://vercel.com",           desc: "前端部署",    icon: "▲" },
      { name: "Cloudflare", url: "https://dash.cloudflare.com",  desc: "CDN / DNS",   icon: "☁" }
    ]
  },
  {
    group: "AI 工具",
    items: [
      { name: "Claude",    url: "https://claude.ai",      desc: "AI 助手",       icon: "✳" },
      { name: "Gemini",    url: "https://gemini.google.com", desc: "Google AI",   icon: "✦" },
      { name: "HuggingFace", url: "https://huggingface.co", desc: "模型社区",     icon: "🤗" }
    ]
  },
  {
    group: "我的服务",
    items: [
      { name: "API 后台", url: "https://example.com",  desc: "管理面板",  icon: "⚙" },
      { name: "监控面板", url: "https://status.example.com", desc: "服务状态", icon: "📊" }
    ]
  }
];

/* ================== 以下为逻辑，一般不用改 ================== */

const app = document.getElementById("app");
const emptyEl = document.getElementById("empty");
const searchEl = document.getElementById("search");
const themeBtn = document.getElementById("themeBtn");

document.getElementById("siteTitle").textContent = SITE_TITLE;
document.title = SITE_TITLE;

// ---------- 主题 ----------
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  themeBtn.textContent = t === "light" ? "☀️" : "🌙";
  localStorage.setItem("nav-theme", t);
}
const savedTheme = localStorage.getItem("nav-theme")
  || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
applyTheme(savedTheme);
themeBtn.addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  applyTheme(cur === "light" ? "dark" : "light");
});

// ---------- 折叠状态 ----------
const collapsed = JSON.parse(localStorage.getItem("nav-collapsed") || "[]");
function saveCollapsed() {
  localStorage.setItem("nav-collapsed", JSON.stringify(collapsed));
}

// ---------- 渲染 ----------
function render(keyword = "") {
  const kw = keyword.trim().toLowerCase();
  app.innerHTML = "";
  let total = 0;

  DATA.forEach((group) => {
    const matched = group.items.filter((it) => {
      if (!kw) return true;
      return (it.name + " " + (it.desc || "") + " " + it.url).toLowerCase().includes(kw);
    });
    if (matched.length === 0) return;
    total += matched.length;

    const isCollapsed = !kw && collapsed.includes(group.group);

    const section = document.createElement("section");
    section.className = "section" + (isCollapsed ? " collapsed" : "");

    const head = document.createElement("div");
    head.className = "section-head";
    head.innerHTML =
      '<span class="section-title">' + esc(group.group) + '</span>' +
      '<span class="section-count">' + matched.length + '</span>' +
      '<span class="section-arrow">▼</span>';

    head.addEventListener("click", () => {
      section.classList.toggle("collapsed");
      const i = collapsed.indexOf(group.group);
      if (section.classList.contains("collapsed")) {
        if (i === -1) collapsed.push(group.group);
      } else if (i !== -1) {
        collapsed.splice(i, 1);
      }
      saveCollapsed();
    });

    const grid = document.createElement("div");
    grid.className = "grid";

    matched.forEach((it) => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = it.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";

      const icon = document.createElement("div");
      icon.className = "card-icon";
      icon.textContent = it.icon || it.name.charAt(0).toUpperCase();

      const body = document.createElement("div");
      body.className = "card-body";
      body.innerHTML =
        '<div class="card-name">' + esc(it.name) + '</div>' +
        (it.desc ? '<div class="card-desc">' + esc(it.desc) + '</div>' : '');

      a.appendChild(icon);
      a.appendChild(body);
      grid.appendChild(a);
    });

    section.appendChild(head);
    section.appendChild(grid);
    app.appendChild(section);
  });

  emptyEl.classList.toggle("show", total === 0);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

render();

// ---------- 搜索 ----------
searchEl.addEventListener("input", (e) => render(e.target.value));

// ---------- 快捷键 ----------
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== searchEl) {
    e.preventDefault();
    searchEl.focus();
  }
  if (e.key === "Escape") {
    searchEl.value = "";
    render();
    searchEl.blur();
  }
});
</script>
</body>
</html>
